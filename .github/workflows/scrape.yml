name: Daily Tournament Scraper

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC (12:00 AM AST)
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run Scraper
        env:
          BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
        run: python tournament_scraper.py
